syntax = "proto3";

package redpanda.core.admin.v2;

import "proto/redpanda/core/pbgen/options.proto";
import "proto/redpanda/core/pbgen/rpc.proto";

option (pbgen.cpp_namespace) = "proto::admin";

service TracingService {
    // GetTracingConfig returns the current tracing configuration.
    rpc GetTracingConfig(GetTracingConfigRequest)
        returns (GetTracingConfigResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    // UpdateTracingConfig updates the tracing configuration on all shards.
    rpc UpdateTracingConfig(UpdateTracingConfigRequest)
        returns (UpdateTracingConfigResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
    // GetTracingStatus returns per-shard tracing status and counters.
    rpc GetTracingStatus(GetTracingStatusRequest)
        returns (GetTracingStatusResponse) {
        option (pbgen.rpc) = {
            authz: SUPERUSER
        };
    }
}

message GetTracingConfigRequest {}

message GetTracingConfigResponse {
    TracingConfig config = 1;
}

message UpdateTracingConfigRequest {
    TracingConfig config = 1;
}

message UpdateTracingConfigResponse {}

message GetTracingStatusRequest {}

message GetTracingStatusResponse {
    repeated ShardStatus shards = 1;
}

message TracingConfig {
    bool enabled = 1;
    SamplingConfig sampling = 2;
    uint32 buffer_size = 3;
    uint32 flush_interval_ms = 4;
    SpanLimits limits = 5;
    ExporterConfig exporter = 6;
}

message ExporterConfig {
    string endpoint_host = 1;
    uint32 endpoint_port = 2;
    string path = 3;
    string auth_header = 4;
    uint32 timeout_ms = 5;
}

message SamplingConfig {
    double default_rate = 1;
    repeated SamplingOverride overrides = 2;
}

message SamplingOverride {
    string scope = 1;
    string name = 2;
    optional double rate = 3;
}

message SpanLimits {
    uint32 max_active_spans_per_shard = 1;
    uint32 max_span_depth = 2;
    uint32 max_children_per_span = 3;
    uint32 max_attributes_per_span = 4;
    uint32 max_events_per_span = 5;
    uint32 max_links_per_span = 6;
}

message ShardStatus {
    uint32 shard_id = 1;
    uint64 spans_recorded = 2;
    uint64 spans_dropped = 3;
    uint64 spans_flushed = 4;
    uint32 active_spans = 5;
    uint64 spans_limited_depth = 6;
    uint64 spans_limited_children = 7;
    uint64 spans_limited_active = 8;
    uint64 spans_sampled_out = 9;
    uint64 attributes_dropped = 10;
    uint64 events_dropped = 11;
    uint64 flush_errors = 12;
}
